; pool-lights — Wemos D1 R1 (ESP8266, CH340G, 4MB flash)
;
; Board id is `d1` = "WEMOS D1 R1". NOT d1_mini: that is the R2/mini with a different
; pin map, and it builds and uploads cleanly while every pin number is wrong.

[platformio]
default_envs = d1

[env]
platform        = espressif8266@4.2.1   ; ships Arduino core 3.1.2, xtensa GCC 10.3.0
framework       = arduino
monitor_speed   = 115200                ; must match Serial.begin(); pio's own default is 9600
monitor_filters = esp8266_exception_decoder, time
build_flags     = -Wall

[env:d1]
board           = d1
upload_speed    = 115200                ; board default; raise to 460800 only once this works

; Globs survive the port number changing between USB ports, and stop PlatformIO from
; auto-picking /dev/cu.Bluetooth-Incoming-Port. Linux hosts: /dev/ttyUSB*
upload_port     = /dev/cu.usbserial*
monitor_port    = /dev/cu.usbserial*

; Uncomment BOTH if opening the monitor resets or silences the board — the ESP8266 core's
; boards.txt sets disableDTR/disableRTS for this board for exactly that reason.
; monitor_dtr   = 0
; monitor_rts   = 0
